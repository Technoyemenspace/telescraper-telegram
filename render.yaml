# Free hosting: Telegram session files are lost when Render restarts or spins down.
services:
  - type: web
    name: telescraper-telegram
    runtime: python
    plan: free
    rootDir: services/telegram
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SESSION_DIR
        value: /tmp/telegram
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_SERVICE_KEY
        sync: false